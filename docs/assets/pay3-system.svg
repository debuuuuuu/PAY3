<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title">
  <title id="title">Pay3 system design</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="48" y="48" fill="#ffffff" font-family="ui-monospace,monospace" font-size="13" letter-spacing="4" opacity="0.45">SYSTEM DESIGN</text>
  <text x="48" y="88" fill="#ffffff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Pay3 · end-to-end architecture</text>

  <!-- layer labels -->
  <text x="48" y="140" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">CLIENTS</text>
  <g font-family="system-ui,sans-serif">
    <rect x="48" y="152" width="200" height="64" rx="12" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="148" y="180" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Web / Dashboard</text>
    <text x="148" y="200" text-anchor="middle" fill="#8a8a8e" font-size="11">Next.js · Freighter</text>

    <rect x="268" y="152" width="200" height="64" rx="12" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="368" y="180" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">AI (Cursor / Claude)</text>
    <text x="368" y="200" text-anchor="middle" fill="#8a8a8e" font-size="11">MCP tools</text>
  </g>

  <text x="48" y="260" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">API EDGE</text>
  <rect x="48" y="272" width="420" height="72" rx="12" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.28"/>
  <text x="258" y="302" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Express API · pay3-api.vercel.app</text>
  <text x="258" y="324" text-anchor="middle" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">auth · sessions · MCP HTTP · policy gate</text>

  <!-- engines -->
  <text x="520" y="140" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">CONTROL PLANE</text>
  <g font-family="system-ui,sans-serif" font-size="13">
    <rect x="520" y="152" width="160" height="56" rx="10" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="600" y="185" text-anchor="middle" fill="#fff">Policy Engine</text>
    <rect x="700" y="152" width="160" height="56" rx="10" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="780" y="185" text-anchor="middle" fill="#fff">Tx Engine</text>
    <rect x="880" y="152" width="160" height="56" rx="10" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="960" y="185" text-anchor="middle" fill="#fff">Recipients</text>

    <rect x="520" y="228" width="160" height="56" rx="10" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="600" y="261" text-anchor="middle" fill="#fff">Session Mgr</text>
    <rect x="700" y="228" width="160" height="56" rx="10" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="780" y="261" text-anchor="middle" fill="#fff">Soroswap</text>
    <rect x="880" y="228" width="160" height="56" rx="10" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
    <text x="960" y="261" text-anchor="middle" fill="#fff">@pay3/stellar</text>
  </g>

  <!-- data + chain -->
  <text x="48" y="400" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">DATA</text>
  <rect x="48" y="412" width="280" height="64" rx="12" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.2"/>
  <text x="188" y="440" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Neon Postgres</text>
  <text x="188" y="460" text-anchor="middle" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">Prisma · AES-GCM secrets</text>

  <text x="380" y="400" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">CUSTODY</text>
  <rect x="380" y="412" width="200" height="64" rx="12" fill="#1a1a1c" stroke="#fff" stroke-opacity="0.35"/>
  <text x="480" y="440" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">AI jar (G / C)</text>
  <text x="480" y="460" text-anchor="middle" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">legacy · Zipper canary</text>

  <text x="640" y="400" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">CHAIN</text>
  <rect x="640" y="412" width="280" height="64" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.35"/>
  <text x="780" y="440" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Stellar + Soroban</text>
  <text x="780" y="460" text-anchor="middle" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="11">Horizon · RPC · Friendbot</text>

  <!-- animated packet -->
  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M148,216 C148,250 258,250 258,272 C258,360 188,360 188,412"/>
  </circle>
  <circle r="5" fill="#ffffff" opacity="0.7">
    <animateMotion dur="4.2s" begin="0.6s" repeatCount="indefinite" path="M368,216 C400,250 400,300 600,180 C780,180 780,300 780,412"/>
  </circle>

  <text x="48" y="540" fill="#8a8a8e" font-family="ui-monospace,monospace" font-size="12">Policy: AUTO · APPROVAL · REJECT &nbsp;|&nbsp; Secrets never leave the API vault &nbsp;|&nbsp; Primary Freighter key never stored</text>
  <line x1="48" y1="560" x2="520" y2="560" stroke="#fff" stroke-opacity="0.12"/>
  <text x="48" y="590" fill="#ffffff" font-family="ui-monospace,monospace" font-size="13" opacity="0.55">paythreewallet.vercel.app</text>
</svg>
